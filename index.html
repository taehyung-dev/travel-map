<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>여행 지도</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing-body">
  <main class="landing">
    <svg class="landing-icon" viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
      <path fill="currentColor" d="M12 2C7.86 2 4.5 5.36 4.5 9.5c0 5.5 7.5 12.5 7.5 12.5s7.5-7 7.5-12.5C19.5 5.36 16.14 2 12 2Zm0 10.25a2.75 2.75 0 1 1 0-5.5 2.75 2.75 0 0 1 0 5.5Z"/>
    </svg>
    <h1 class="landing-title">여행 지도</h1>
    <p class="landing-subtitle">지역을 눌러 대표 명소를 만나보세요</p>

    <div class="id-box">
      <label class="id-label" for="userIdInput">나만의 아이디</label>
      <input
        class="id-input"
        id="userIdInput"
        type="text"
        placeholder="예: taehyung"
        maxlength="40"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <p class="id-hint">
        아이디로 내 기록을 다른 기기에서도 이어볼 수 있어요.<br />
        (비밀번호는 없어요 - 같은 아이디를 입력하면 누구나 볼 수 있으니
        나만 아는 아이디를 사용하세요)
      </p>
    </div>

    <a class="landing-cta" id="startBtn" href="map.html">지도 시작하기</a>
  </main>

  <script src="app-id.js?v=2"></script>
</body>
</html>
